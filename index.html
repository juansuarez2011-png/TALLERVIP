<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Mecánico Syntro - Sistema Cloud Integral</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .neumo-card {
            background: #1e293b;
            box-shadow: 8px 8px 16px #0b1120, -8px -8px 16px #314159;
            border-radius: 1rem;
        }
        .neumo-input {
            background: #0f172a;
            box-shadow: inset 4px 4px 8px #0b1120, inset -4px -4px 8px #314159;
            border: none;
            color: #ffffff;
        }
        .neumo-button {
            background: #3b82f6;
            box-shadow: 4px 4px 8px #1d4ed8, -4px -4px 8px #60a5fa;
            transition: all 0.2s ease;
        }
        .neumo-button:active {
            box-shadow: inset 2px 2px 4px #1d4ed8, inset -2px -2px 4px #60a5fa;
        }
        .neumo-button-secondary {
            background: #059669;
            box-shadow: 4px 4px 8px #047857, -4px -4px 8px #10b981;
        }
        .neumo-button-purple {
            background: #7c3aed;
            box-shadow: 4px 4px 8px #5b21b6, -4px -4px 8px #8b5cf6;
        }
        .neumo-button-red {
            background: #dc2626;
            box-shadow: 4px 4px 8px #991b1b, -4px -4px 8px #ef4444;
        }
    </style>
</head>
<body class="p-4 md:p-6 min-h-screen flex flex-col justify-between">

    <!-- PANTALLA DE LOGIN -->
    <div id="auth-container" class="max-w-md mx-auto my-auto w-full neumo-card p-8">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-400">Taller Mecánico Syntro</h1>
            <p class="text-xs text-slate-400 mt-1">Acceso Autorizado Operadores</p>
        </div>
        <form onsubmit="manejarAutenticacion(event)" class="space-y-4">
            <div>
                <label class="block text-sm text-slate-400 mb-1">Correo Electrónico</label>
                <input type="email" id="auth-email" required class="w-full p-3 rounded-lg neumo-input focus:outline-none" placeholder="taller@syntro.com">
            </div>
            <div>
                <label class="block text-sm text-slate-400 mb-1">Contraseña</label>
                <input type="password" id="auth-password" required class="w-full p-3 rounded-lg neumo-input focus:outline-none" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full py-3 rounded-lg font-semibold text-white neumo-button">
                Iniciar Sesión / Registrarse
            </button>
        </form>
    </div>

    <!-- APLICACIÓN PRINCIPAL -->
    <div id="app-container" class="max-w-7xl mx-auto w-full hidden">
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 p-4 neumo-card gap-4">
            <div>
                <h1 class="text-2xl font-bold text-blue-400">Taller Mecánico Syntro</h1>
                <p class="text-xs text-slate-400">Operador Activo: <span id="user-display" class="text-emerald-400 font-mono"></span></p>
            </div>
            <div class="flex items-center gap-6">
                <div class="text-center md:text-right">
                    <div id="timer" class="text-lg font-mono text-emerald-400">00:00:00</div>
                    <div id="sync-status" class="text-xs text-emerald-400">Cloud Sincronizado</div>
                </div>
                <button onclick="cerrarSesion()" class="px-4 py-2 rounded-lg text-xs font-semibold text-white neumo-button-red">
                    Salir
                </button>
            </div>
        </header>

        <main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- COLUMNA 1: Módulo 1 - Clientes -->
            <div class="space-y-6">
                <section class="neumo-card p-6">
                    <h2 class="text-xl font-semibold mb-4 text-slate-200">Módulo 1: Clientes</h2>
                    
                    <div class="mb-4 p-3 rounded-xl border border-slate-700 bg-slate-900/50">
                        <label class="block text-xs text-blue-400 font-semibold uppercase mb-1">Buscar Cliente</label>
                        <div class="flex gap-2">
                            <input type="text" id="criterio-busqueda" class="w-full p-2 rounded-lg neumo-input text-sm focus:outline-none" placeholder="Cédula, RIF o Nombre">
                            <button type="button" onclick="buscarCliente()" class="px-3 py-2 rounded-lg text-white font-semibold text-xs neumo-button-secondary">Buscar</button>
                        </div>
                    </div>

                    <form id="client-form" onsubmit="guardarCliente(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Cédula o RIF</label>
                            <input type="text" id="cedula" required class="w-full p-2 rounded-lg neumo-input text-sm focus:outline-none" placeholder="V-12345678">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Nombre y Apellido</label>
                            <input type="text" id="nombre" required class="w-full p-2 rounded-lg neumo-input text-sm focus:outline-none" placeholder="Juan Suárez">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Teléfono</label>
                            <input type="text" id="telefono" required class="w-full p-2 rounded-lg neumo-input text-sm focus:outline-none" placeholder="0414-1234567">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Dirección</label>
                            <textarea id="direccion" rows="2" required class="w-full p-2 rounded-lg neumo-input text-sm focus:outline-none" placeholder="Dirección"></textarea>
                        </div>
                        <button type="submit" class="w-full py-2 rounded-lg text-xs font-semibold text-white neumo-button">
                            Guardar Cliente
                        </button>
                    </form>
                </section>
            </div>

            <!-- COLUMNAS 2 y 3: Módulos 2 y 3 (Recepción, Mapa Base y Checklist) -->
            <div class="lg:col-span-2 space-y-6">
                <section class="neumo-card p-6">
                    <h2 class="text-xl font-semibold mb-4 text-slate-200">Módulos 2 y 3: Recepción y Mapa Base del Vehículo</h2>
                    
                    <form id="orden-form" onsubmit="guardarOrdenServicio(event)" class="space-y-6">
                        
                        <!-- Datos Principales de Recepción -->
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Código de Orden</label>
                                <input type="text" id="ord-codigo" readonly class="w-full p-2 rounded-lg neumo-input text-sm font-mono text-emerald-400 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Placa (Búsqueda Inteligente)</label>
                                <input type="text" id="ord-placa" list="lista-placas" required oninput="seleccionarPlacaInteligente(this.value)" class="w-full p-2 rounded-lg neumo-input text-sm uppercase font-mono text-amber-400 focus:outline-none" placeholder="Escriba placa...">
                                <datalist id="lista-placas"></datalist>
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Fecha y Hora de Ingreso</label>
                                <input type="datetime-local" id="ord-fecha" required class="w-full p-2 rounded-lg neumo-input text-xs focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Cliente / Propietario</label>
                                <input type="text" id="ord-cliente" required class="w-full p-2 rounded-lg neumo-input text-sm focus:outline-none" placeholder="Nombre del cliente">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Teléfono</label>
                                <input type="text" id="ord-telefono" required class="w-full p-2 rounded-lg neumo-input text-sm focus:outline-none" placeholder="Teléfono">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">E-mail</label>
                                <input type="email" id="ord-email" class="w-full p-2 rounded-lg neumo-input text-sm focus:outline-none" placeholder="Correo electrónico">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Marca</label>
                                <input type="text" id="ord-marca" required class="w-full p-2 rounded-lg neumo-input text-sm focus:outline-none" placeholder="Hyundai">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Modelo</label>
                                <input type="text" id="ord-modelo" required class="w-full p-2 rounded-lg neumo-input text-sm focus:outline-none" placeholder="Elantra">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Año</label>
                                <input type="text" id="ord-anio" required class="w-full p-2 rounded-lg neumo-input text-sm focus:outline-none" placeholder="2010">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Kilometraje</label>
                                <input type="text" id="ord-km" required class="w-full p-2 rounded-lg neumo-input text-sm focus:outline-none" placeholder="64500">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Serial Carrocería (VIN)</label>
                                <input type="text" id="ord-serial-carroceria" required class="w-full p-2 rounded-lg neumo-input text-sm uppercase font-mono focus:outline-none" placeholder="Serial carrocería">
                            </div>
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Serial Batería</label>
                                <input type="text" id="ord-serial-bateria" required class="w-full p-2 rounded-lg neumo-input text-sm uppercase font-mono focus:outline-none" placeholder="Serial batería">
                            </div>
                        </div>

                        <!-- Servicios, Grúa y Mecánico -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs text-slate-400 mb-1">Trabajo / Servicio a Realizar</label>
                                <textarea id="ord-servicio" rows="3" required class="w-full p-2 rounded-lg neumo-input text-sm focus:outline-none" placeholder="Mantenimiento de radiador, mangueras..."></textarea>
                            </div>
                            <div class="space-y-3">
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="block text-xs text-slate-400 mb-1">Ingreso en Grúa</label>
                                        <select id="ord-grua" class="w-full p-2 rounded-lg neumo-input text-sm focus:outline-none">
                                            <option value="NO">No</option>
                                            <option value="SI">Sí</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs text-slate-400 mb-1">Mecánico Asignado</label>
                                        <input type="text" id="ord-mecanico" required class="w-full p-2 rounded-lg neumo-input text-sm focus:outline-none" value="ANTONIO GUTIERREZ">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs text-slate-400 mb-1">Fotografía de Recepción</label>
                                    <input type="file" id="ord-foto" accept="image/*" class="w-full text-xs text-slate-300 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white cursor-pointer">
                                </div>
                            </div>
                        </div>

                        <!-- CHECKLIST DE ACCESORIOS Y ESTADO -->
                        <div class="p-4 rounded-xl border border-slate-700 bg-slate-900/40 space-y-3">
                            <h3 class="text-sm font-bold text-blue-400 uppercase tracking-wider">Checklist de Accesorios y Estado</h3>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-3 text-xs">
                                <div>
                                    <span class="text-slate-400">Gato</span>
                                    <select id="chk-gato" class="w-full p-1 rounded neumo-input mt-1"><option value="SI
