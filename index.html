<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Mecánico - Consulta Firebase (Placa / Cédula / RIF)</title>
    <!-- Firebase App (Modular SDK v9+) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // CONFIGURACIÓN DE TU PROYECTO FIREBASE (taller-mecanico-c2124)
        const firebaseConfig = {
            apiKey: "TU_API_KEY",
            authDomain: "taller-mecanico-c2124.firebaseapp.com",
            projectId: "taller-mecanico-c2124",
            storageBucket: "taller-mecanico-c2124.appspot.com",
            messagingSenderId: "TU_MESSAGING_SENDER_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let timerInterval;
        let secondsElapsed = 0;

        function startTimer() {
            secondsElapsed = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function logMessage(msg) {
            const consoleBox = document.getElementById('logConsole');
            const timestamp = new Date().toLocaleTimeString();
            consoleBox.innerHTML += `[${timestamp}] ${msg}<br>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function updateProgress(percent) {
            document.getElementById('progressBar').style.width = percent + '%';
        }

        // Función global de búsqueda vinculada a Firebase
        window.buscarEnFirebase = async function() {
            const criterio = document.getElementById('inputCriterio').value.trim().toUpperCase();
            const tipoBusqueda = document.getElementById('selectTipo').value; // 'placa' o 'documento'
            
            if (!criterio) {
                alert("Por favor ingrese una placa, cédula o RIF para consultar.");
                return;
            }

            const resultadosDiv = document.getElementById('resultadosContainer');
            resultadosDiv.innerHTML = "";
            document.getElementById('logConsole').innerHTML = "";
            
            startTimer();
            updateProgress(20);
            logMessage(`Iniciando conexión con Firestore (${tipoBusqueda}: ${criterio})...`);

            try {
                // Ajusta 'vehiculos' al nombre de tu colección principal en Firestore
                const refVehiculos = collection(db, "vehiculos");
                let q;

                if (tipoBusqueda === 'placa') {
                    q = query(refVehiculos, where("placa", "==", criterio));
                } else {
                    q = query(refVehiculos, where("cedula_rif", "==", criterio));
                }

                updateProgress(50);
                logMessage("Ejecutando consulta indexada en Firebase...");

                const querySnapshot = await getDocs(q);
                updateProgress(80);

                if (querySnapshot.empty) {
                    logMessage("No se encontraron registros con los parámetros indicados.");
                    resultadosDiv.innerHTML = `<div class="neu-card" style="text-align:center; color:#ff6b6b;">No se encontraron registros para: <b>${criterio}</b></div>`;
                    updateProgress(100);
                    stopTimer();
                    return;
                }

                let htmlContent = "";
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    logMessage(`Registro encontrado ID: ${doc.id}`);
                    htmlContent += `
                        <div class="neu-card result-card">
                            <h3>🚗 Vehículo: ${data.marca || 'N/D'} ${data.modelo || ''} (${data.anio || ''})</h3>
                            <p><b>Placa:</b> ${data.placa || 'N/D'}</p>
                            <p><b>Color:</b> ${data.color || 'N/D'}</p>
                            <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">
                            <h4>👤 Datos del Cliente</h4>
                            <p><b>Nombre:</b> ${data.cliente_nombre || 'N/D'}</p>
                            <p><b>Cédula / RIF:</b> ${data.cedula_rif || 'N/D'}</p>
                            <p><b>Teléfono:</b> ${data.telefono || 'N/D'}</p>
                            <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">
                            <h4>🔧 Último Diagnóstico / Estado</h4>
                            <p>${data.diagnostico_reciente || 'Sin observaciones registradas.'}</p>
                        </div>
                    `;
                });

                resultadosDiv.innerHTML = htmlContent;
                updateProgress(100);
                logMessage("Consulta finalizada exitosamente.");
                stopTimer();

            } catch (error) {
                console.error("Error al consultar Firebase:", error);
                logMessage(`ERROR CRÍTICO: ${error.message}`);
                updateProgress(100);
                stopTimer();
            }
        }
    </script>

    <style>
        :root {
            --bg-color: #1a1a1a;
            --neu-dark: #111111;
            --neu-light: #232323;
            --shadow-1: -5px -5px 10px #262626, 5px 5px 10px #0e0e0e;
            --shadow-inset: inset 3px 3px 6px #0e0e0e, inset -3px -3px 6px #262626;
            --accent: #00adb5;
            --text-color: #e0e0e0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 900px;
            background: var(--bg-color);
            padding: 30px;
            border-radius: 20px;
            box-shadow: var(--shadow-1);
        }

        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px #0e0e0e;
        }

        .neu-card {
            background: var(--bg-color);
            padding: 20px;
            border-radius: 15px;
            box-shadow: var(--shadow-1);
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        select, input {
            background: var(--bg-color);
            color: var(--text-color);
            border: none;
            padding: 12px 15px;
            border-radius: 10px;
            box-shadow: var(--shadow-inset);
            font-size: 16px;
            outline: none;
            flex: 1;
            min-width: 200px;
        }

        button.neu-btn {
            background: var(--bg-color);
            color: var(--accent);
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            box-shadow: var(--shadow-1);
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.2s ease;
        }

        button.neu-btn:active {
            box-shadow: var(--shadow-inset);
            color: #fff;
        }

        /* Panel de Estado, Progreso y Log */
        .status-bar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .progress-track {
            background: var(--bg-color);
            height: 12px;
            border-radius: 6px;
            box-shadow: var(--shadow-inset);
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            background: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .log-console {
            background: var(--neu-dark);
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            padding: 12px;
            border-radius: 10px;
            box-shadow: var(--shadow-inset);
            height: 100px;
            overflow-y: auto;
            font-size: 13px;
        }

        .result-card {
            border-left: 4px solid var(--accent);
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>TALLER MECÁNICO - CONSULTA FIREBASE</h1>

        <!-- Controles de Consulta -->
        <div class="neu-card">
            <div class="input-group">
                <select id="selectTipo">
                    <option value="placa">Buscar por Placa</option>
                    <option value="documento">Buscar por Cédula / RIF</option>
                </select>
                <input type="text" id="inputCriterio" placeholder="Ej: ABC1234 o V12345678...">
                <button class="neu-btn" onclick="buscarEnFirebase()">Consultar</button>
            </div>

            <!-- Barra de Progreso, Temporizador y Log -->
            <div class="status-bar-container">
                <span>⏱️ Tiempo de ejecución: <strong id="timer">00:00</strong></span>
            </div>
            <div class="progress-track">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div id="logConsole" class="log-console">Sistema listo para consulta en Firestore...</div>
        </div>

        <!-- Contenedor de Resultados -->
        <div id="resultadosContainer">
            <div class="neu-card" style="text-align: center; color: #777;">
                Los datos del vehículo y del cliente aparecerán aquí al realizar la consulta.
            </div>
        </div>
    </div>

</body>
</html>
