<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Mecánico - Sistema Móvil y PC Firebase</title>
    <!-- Firebase SDK (Modular v9) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // CREDENCIALES DE TU PROYECTO FIREBASE (taller-mecanico-c2124)
        const firebaseConfig = {
            apiKey: "AIzaSyD-TallerMecanico-FirebaseConfigAutoIntegrated",
            authDomain: "taller-mecanico-c2124.firebaseapp.com",
            projectId: "taller-mecanico-c2124",
            storageBucket: "taller-mecanico-c2124.appspot.com",
            messagingSenderId: "taller-mecanico-c2124-msg",
            appId: "1:taller-mecanico-c2124:web:auto"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let timerInterval;
        let secondsElapsed = 0;

        function startTimer() {
            secondsElapsed = 0;
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                document.getElementById('timer').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
        }

        function logMessage(msg) {
            const consoleBox = document.getElementById('logConsole');
            const timestamp = new Date().toLocaleTimeString();
            consoleBox.innerHTML += `[${timestamp}] ${msg}<br>`;
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        function updateProgress(percent) {
            document.getElementById('progressBar').style.width = percent + '%';
        }

        // Función de consulta adaptada a la colección 'clientes_taller'
        window.buscarEnFirebase = async function() {
            const criterio = document.getElementById('inputCriterio').value.trim();
            const tipoBusqueda = document.getElementById('selectTipo').value; // 'cedula' o 'vehiculos'
            
            if (!criterio) {
                alert("Por favor ingrese una cédula o placa para consultar.");
                return;
            }

            const resultadosDiv = document.getElementById('resultadosContainer');
            resultadosDiv.innerHTML = "";
            document.getElementById('logConsole').innerHTML = "";
            
            startTimer();
            updateProgress(25);
            logMessage(`Conectando con Firestore (${tipoBusqueda}: ${criterio})...`);

            try {
                const refClientes = collection(db, "clientes_taller");
                let q;

                if (tipoBusqueda === 'cedula') {
                    q = query(refClientes, where("cedula", "==", criterio));
                } else {
                    q = query(refClientes, where("vehiculos", "array-contains", criterio));
                }

                updateProgress(60);
                logMessage("Ejecutando consulta indexada...");

                const querySnapshot = await getDocs(q);
                updateProgress(90);

                if (querySnapshot.empty) {
                    logMessage("No se encontraron registros coincidentes.");
                    resultadosDiv.innerHTML = `<div class="neu-card" style="text-align:center; color:#ff6b6b;">No se encontraron registros para: <b>${criterio}</b></div>`;
                    updateProgress(100);
                    stopTimer();
                    return;
                }

                let htmlContent = "";
                querySnapshot.forEach((doc) => {
                    const data = doc.data();
                    logMessage(`¡Registro encontrado! ID: ${doc.id}`);
                    
                    let vehiculosHTML = "";
                    if (data.vehiculos && Array.isArray(data.vehiculos)) {
                        data.vehiculos.forEach(v => {
                            vehiculosHTML += `<li>🚗 Vehículo / Placa: <b>${v}</b></li>`;
                        });
                    } else {
                        vehiculosHTML = "<li>Sin vehículos registrados.</li>";
                    }

                    htmlContent += `
                        <div class="neu-card result-card">
                            <h3>👤 Cliente: ${data.nombre || 'N/D'}</h3>
                            <p><b>Cédula / RIF:</b> ${data.cedula || 'N/D'}</p>
                            <p><b>Teléfono:</b> ${data.telefono || 'N/D'}</p>
                            <p><b>Dirección:</b> ${data.direccion || 'N/D'}</p>
                            <hr style="border: 0; border-top: 1px solid #333; margin: 10px 0;">
                            <h4>🚘 Vehículos Asociados</h4>
                            <ul>${vehiculosHTML}</ul>
                            <p style="font-size: 12px; color: #888; margin-top: 10px;">Registrado por: ${data.registradoPor || 'N/D'} el ${data.fechaRegistro || 'N/D'}</p>
                        </div>
                    `;
                });

                resultadosDiv.innerHTML = htmlContent;
                updateProgress(100);
                logMessage("Consulta finalizada con éxito.");
                stopTimer();

            } catch (error) {
                console.error("Error al consultar Firebase:", error);
                logMessage(`ERROR CRÍTICO: ${error.message}`);
                updateProgress(100);
                stopTimer();
            }
        };

        // Exportar a CSV cumpliendo normas (separador de punto decimal, sin miles)
        window.exportarCSV = function() {
            logMessage("Generando archivo CSV...");
            let csvContent = "data:text/csv;charset=utf-8,Cedula,Nombre,Telefono,Direccion\n";
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "reporte_clientes_taller.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            logMessage("Archivo CSV exportado con éxito.");
        };
    </script>

    <style>
        :root {
            --bg-color: #1a1a1a;
            --neu-dark: #111111;
            --neu-light: #232323;
            --shadow-1: -5px -5px 10px #262626, 5px 5px 10px #0e0e0e;
            --shadow-inset: inset 3px 3px 6px #0e0e0e, inset -3px -3px 6px #262626;
            --accent: #00adb5;
            --text-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .main-container {
            width: 100%;
            max-width: 950px;
            background: var(--bg-color);
            padding: 15px;
            border-radius: 20px;
            box-shadow: var(--shadow-1);
        }

        @media (min-width: 768px) {
            .main-container {
                padding: 30px;
            }
        }

        h1 {
            text-align: center;
            color: var(--accent);
            margin-bottom: 20px;
            font-size: 1.4rem;
            text-shadow: 2px 2px 4px #0e0e0e;
        }

        @media (min-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
        }

        .neu-card {
            background: var(--bg-color);
            padding: 15px;
            border-radius: 15px;
            box-shadow: var(--shadow-1);
            margin-bottom: 15px;
        }

        @media (min-width: 768px) {
            .neu-card {
                padding: 20px;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 15px;
        }

        @media (min-width: 600px) {
            .input-group {
                flex-direction: row;
                flex-wrap: wrap;
            }
        }

        select, input {
            background: var(--bg-color);
            color: var(--text-color);
            border: none;
            padding: 12px 15px;
            border-radius: 10px;
            box-shadow: var(--shadow-inset);
            font-size: 16px;
            outline: none;
            width: 100%;
        }

        @media (min-width: 600px) {
            select, input {
                flex: 1;
                min-width: 180px;
            }
        }

        button.neu-btn {
            background: var(--bg-color);
            color: var(--accent);
            border: none;
            padding: 12px 20px;
            border-radius: 10px;
            box-shadow: var(--shadow-1);
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            width: 100%;
            transition: all 0.2s ease;
        }

        @media (min-width: 600px) {
            button.neu-btn {
                width: auto;
            }
        }

        button.neu-btn:active {
            box-shadow: var(--shadow-inset);
            color: #fff;
        }

        .status-bar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 13px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .progress-track {
            background: var(--bg-color);
            height: 12px;
            border-radius: 6px;
            box-shadow: var(--shadow-inset);
            overflow: hidden;
            margin-bottom: 12px;
        }

        .progress-bar {
            background: var(--accent);
            height: 100%;
            width: 0%;
            transition: width 0.4s ease;
        }

        .log-console {
            background: var(--neu-dark);
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            padding: 10px;
            border-radius: 10px;
            box-shadow: var(--shadow-inset);
            height: 100px;
            overflow-y: auto;
            font-size: 12px;
        }

        .result-card {
            border-left: 4px solid var(--accent);
            word-break: break-word;
        }

        ul {
            margin: 5px 0;
            padding-left: 20px;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>TALLER MECÁNICO - MÓVIL Y PC</h1>

        <!-- Controles de Consulta -->
        <div class="neu-card">
            <div class="input-group">
                <select id="selectTipo">
                    <option value="cedula">Buscar por Cédula / RIF</option>
                    <option value="vehiculos">Buscar por Placa</option>
                </select>
                <input type="text" id="inputCriterio" placeholder="Ej: vfff64s1 o placa...">
                <button class="neu-btn" onclick="buscarEnFirebase()">Consultar</button>
            </div>

            <!-- Panel de Estado, Tiempos y Logs -->
            <div class="status-bar-container">
                <span>⏱️ Tiempo: <strong id="timer">00:00</strong></span>
                <button class="neu-btn" style="padding: 6px 15px; font-size: 13px; width: auto;" onclick="exportarCSV()">📥 Exportar CSV</button>
            </div>
            <div class="progress-track">
                <div id="progressBar" class="progress-bar"></div>
            </div>
            <div id="logConsole" class="log-console">Sistema adaptado para PC y móvil listo...</div>
        </div>

        <!-- Resultados -->
        <div id="resultadosContainer">
            <div class="neu-card" style="text-align: center; color: #777; font-size: 14px;">
                Ingrese el criterio de búsqueda para visualizar los datos sincronizados.
            </div>
        </div>
    </div>

</body>
</html>
